<!doctype html>
<!-- Source of the cover of /blog/risikobasierte-teststrategie-ios (1920x1080).
     Rendered to public/blog/risikobasierte-teststrategie-ios/titelbild.webp and og.jpg by
     scripts/blog-cover/render.mjs. Rebuilt 2026-11-27 after agent-bridge #41 moved the
     title to the first person; the first cover (PR #355) had no source in the repo. -->
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=block" rel="stylesheet">
<style>
  :root { --cyan: #00d4ff; --cyan-text: #22d3ee; --cyan-deep: #00b9d5; --teal: #0c89a1;
          --grey-hi: #46698d; --grey-lo: #2c4a6b; --label: #a3b3c6; --sub: #cbd5e1; --white: #f1f5f9; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    position: relative; font-family: Inter, sans-serif; color: var(--white);
    background:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px) 0 0 / 60px 60px,
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px) 0 0 / 60px 60px,
      radial-gradient(ellipse 1100px 800px at 1250px 560px, #143558 0%, #0d2845 50%, #071b2f 100%);
  }
  .links { position: absolute; left: 150px; top: 250px; width: 760px; }
  .kicker { font-weight: 600; font-size: 25px; letter-spacing: 0.14em; color: var(--cyan-text); text-transform: uppercase; }
  h1 { margin-top: 28px; font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 96px;
       line-height: 100px; letter-spacing: -0.01em; color: var(--white); }
  h1 span { color: var(--cyan-deep); }
  .unter { margin-top: 33px; font-size: 30px; line-height: 42px; color: var(--sub); max-width: 760px; }
  .logo { position: absolute; left: 150px; top: 918px; font-family: "Space Grotesk", sans-serif;
          font-weight: 700; font-size: 39px; color: var(--white); letter-spacing: -0.01em; }
  .logo span { color: var(--cyan); }
  .label { position: absolute; top: 297px; width: 300px; text-align: center; font-weight: 600;
           font-size: 22px; letter-spacing: 0.1em; color: var(--label); }
  .bar { position: absolute; height: 62px; border-radius: 6px; }
  .cap { position: absolute; top: 720px; width: 360px; text-align: center; font-size: 22px; line-height: 31px; color: var(--label); }
  .pfeil { position: absolute; left: 1385px; top: 536px; width: 40px; height: 6px; background: var(--cyan-deep); border-radius: 2px; }
  .pfeil::after { content: ""; position: absolute; right: -16px; top: -9px; border-left: 18px solid var(--cyan-deep);
                  border-top: 12px solid transparent; border-bottom: 12px solid transparent; }
</style>
</head>
<body>
  <div class="links">
    <p class="kicker">Testmanagement mit KI-Agenten</p>
    <h1>Ich teste nicht mehr alles. <span>Ich teste, was brechen kann.</span></h1>
    <p class="unter">Risikobasierte Teststrategie für zwei iOS-Apps: Teststufen, Test zuerst und ISTQB als gemeinsame Sprache.</p>
  </div>
  <p class="logo">neckarshore<span>.ai</span></p>

  <p class="label" style="left:1058px">VORHER</p>
  <div class="bar" style="left:1058px;top:347px;width:300px;background:var(--grey-hi)"></div>
  <div class="bar" style="left:1083px;top:419px;width:250px;background:var(--grey-hi)"></div>
  <div class="bar" style="left:1133px;top:491px;width:150px;background:var(--grey-lo)"></div>
  <div class="bar" style="left:1163px;top:563px;width:90px;background:var(--grey-lo)"></div>
  <div class="bar" style="left:1188px;top:635px;width:40px;background:var(--grey-lo)"></div>
  <p class="cap" style="left:1028px">Testzeit:<br>99 % UI-Tests</p>

  <div class="pfeil"></div>

  <p class="label" style="left:1463px">ZIEL</p>
  <div class="bar" style="left:1583px;top:347px;width:60px;border:3px solid var(--cyan-text);background:transparent"></div>
  <div class="bar" style="left:1553px;top:419px;width:120px;background:var(--teal)"></div>
  <div class="bar" style="left:1523px;top:491px;width:180px;background:var(--cyan-deep)"></div>
  <div class="bar" style="left:1493px;top:563px;width:240px;background:var(--cyan-deep)"></div>
  <div class="bar" style="left:1463px;top:635px;width:300px;background:var(--cyan)"></div>
  <p class="cap" style="left:1433px">Jedes Kriterium<br>so tief wie möglich</p>
</body>
</html>
