name: E2E (Playwright)

# Wires the local Playwright suite into CI so it gates every PR + push to main.
# Until now the e2e suite ran local-only (CLAUDE.md: "CI-side E2E is a backlog
# item") — the 91 tests blocked no merge. This is the structural
# "tests-before-features" gate (L-TEST-COVERAGE-PACKAGE item 1).
#
# The dev server is managed by Playwright's `webServer` block in
# playwright.config.ts (`npm run dev` on :3000) — no separate build/start step
# needed. The config already sets workers=1 + retries=2 under CI for
# shared-runner stability.
#
# Uses `test:e2e:ci` = `playwright test --grep-invert @external`: the gate runs
# only deterministic tests of our own code. @external-tagged tests hit
# third-party hosts (EU ODR link, Calendly) which bot-block datacenter IPs →
# false fails in CI. External-URL liveness is covered by the link-crawler cron
# (L-TEST-COVERAGE-PACKAGE item 3); full local `npm run test:e2e` still runs them.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Cancel superseded PR runs; let every push-to-main run complete (each main
  # commit stays gated).
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (excludes @external)
        run: npm run test:e2e:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # ESTATE PRODUCER. Until now this repo was the estate AGGREGATOR that reported
  # no number of its own: of the built website repos, goldoni, grafowerk, oakwood,
  # rauhut and site-quality all self-report — neckarshore-website did not. Its
  # count therefore came from the hand-written seed line in
  # estate-test-scope-seed.json (total 308 @a1561cb, measured 2026-06-30), which
  # nothing compares against origin/main. Lenin re-measured 654 on 2026-09-02
  # @8df6f83 — the published number was 346 tests short and had been overtaken by
  # the coverage matrix 48 days earlier without anything carrying that across.
  # Once this job runs, live-wins discards the seed line by itself; it does NOT
  # need deleting (#2032, Lenin C1).
  #
  # WHY THIS IS BUILDABLE TODAY, contrary to what the sister repos' comments say:
  # goldoni and oakwood both carry the sentence that their node:test / check()
  # suites "print no reporter format any test-stats-action adapter parses". That
  # was true at pin 54ae407 (2026-07-08). The `node-test` and `tsx` adapters
  # landed on 2026-07-17 in 6130f0f, "close the gap that dropped 5 repos' unit
  # halves" — so the sentence has been eight weeks stale, and it is the reason
  # this repo's 210-test unit family looked unemittable. Measured, not inferred:
  # neckarshore-ai/test-stats-action#8 names the same misreading in three places.
  # This job therefore pins 893875d (main tip, 2026-08-06), not the older 54ae407.
  emit-stats:
    name: Emit stats.json (estate producer)
    needs: e2e
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      # Serialize emits so two rapid pushes cannot race on the git push to stats-data.
      group: emit-stats-${{ github.ref }}
      cancel-in-progress: false

    steps:
      # Default persist-credentials (true) — the publish step pushes stats.json to the
      # UNPROTECTED stats-data branch via the job's contents:write GITHUB_TOKEN. No branch
      # protection guards stats-data, so this push needs no bypass actor, no PAT, and it
      # touches nothing on main. (This is the AD-59 shape; update-stats.yml still writes to
      # main with secrets.STATS_PAT and is the named, dated exception tracked as #2030.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Enumerate the GATED e2e selection for its count. `--list` collects only (no server,
      # no browser) and prints the authoritative "Total: N tests in M files". The e2e
      # EXECUTION verdict comes from needs.e2e.result above; `--grep-invert @external` is
      # exactly what test:e2e:ci gates, so the number reflects what CI actually enforces.
      - name: Capture e2e reporter (playwright --list)
        run: npx playwright test --grep-invert @external --list > /tmp/e2e-list.out 2>&1 || true

      # The four unit runners that unit.yml gates inside its single required check
      # "Node unit tests (tests/unit)". They are re-EXECUTED here purely to capture each
      # runner's own reporter output; the gating fact is unit.yml, not this job. `|| true`
      # keeps a failure from aborting the capture — a red suite must still emit, and the
      # node-test/tsx adapters read the failure out of the runner's own summary and set
      # red:true themselves rather than silently undercounting.
      - name: Capture unit reporters
        run: |
          npm run test:unit              > /tmp/unit.out         2>&1 || true
          npm run test:lighthouse:unit   > /tmp/lh-unit.out      2>&1 || true
          npm run test:audit-gate:unit   > /tmp/audit-gate.out   2>&1 || true
          npm run test:search:unit       > /tmp/search-unit.out  2>&1 || true

      # runners = executed AND CI-gated AND disjoint. Disjointness is measured, not assumed:
      # test:unit lists 18 files, all under tests/unit/, none under scripts/ — so the 6
      # lighthouse-profile cases are a separate runner, not a subset (Lenin corrected the
      # coverage matrix's "incl." wording on exactly this point).
      #
      # DELIBERATELY NOT COUNTED, and this is a cut rather than an oversight:
      # `crawl:test` (17) and the linkcheck `--self-test` (24) use the same hand-written
      # check() harness as audit-gate and search:unit and would parse fine with the tsx
      # adapter. Whether a --self-test flag on a production script counts additively is an
      # OPEN charter question (the 2026-07-11 ratification put bash script gates on the
      # non-additive side), and Lenin filed his 654 as a measurement with that question
      # held separate. Emitting 671 here would settle an estate-wide classification by way
      # of a workflow edit in one repo. When the charter decides, this is a two-line change.
      - name: Emit stats.json
        uses: neckarshore-ai/test-stats-action@893875deeeaed23438bb02fbb988dfa143a53fd7
        with:
          repo: ${{ github.repository }}
          out: stats.json
          sha: ${{ github.sha }}
          test_result: ${{ needs.e2e.result }}
          runners: |
            e2e:playwright:/tmp/e2e-list.out
            unit:node-test:/tmp/unit.out
            unit:node-test:/tmp/lh-unit.out
            unit:tsx:/tmp/audit-gate.out
            unit:tsx:/tmp/search-unit.out

      # Structural contract gate — invariants that hold on BOTH green and red runs.
      # Deliberately does NOT assert a golden total: a red run legitimately undercounts and
      # must still emit, or the aggregator goes blind instead of warning. It DOES assert
      # both byType keys, because losing one silently is precisely how this repo published
      # 308 for ten weeks.
      - name: Validate emitted stats.json against the contract
        run: |
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .repo == $repo
            and (.audited_sha | type == "string" and length > 0)
            and (.tests.total == ([.tests.byType[]] | add))
            and (.tests.byType | has("e2e"))
            and (.tests.byType | has("unit"))
            and (.tests.declared == {})
            and (.red | type == "boolean")
          ' stats.json > /dev/null \
            || { echo "::error::stats.json failed contract validation"; cat stats.json; exit 1; }
          echo "stats.json is contract-valid:"; cat stats.json

      # Publish to the UNPROTECTED `stats-data` branch (never main — main's protection stays
      # 100% intact). Built with git PLUMBING (hash-object -> mktree -> commit-tree -> push),
      # NOT a working-tree branch switch: stats-data shares no history with main, so a
      # `git checkout` would abort with "would be overwritten". Plumbing writes one blob, one
      # tree and one commit to the object DB and pushes the ref, touching neither the working
      # tree nor the current branch.
      #
      # Diff-guard on the meaningful fields only (everything EXCEPT the always-changing
      # updatedAt): a new push has a new audited_sha -> publish; a re-run on the same sha
      # differs only by timestamp -> no churn commit. The concurrency group serializes it.
      #
      # WHY VERCEL DOES NOT BUILD THIS BRANCH, and why the answer is not in this repo
      # (measured 2026-09-10): every push here used to trigger a Vercel build that failed with
      # "Couldn't find any `pages` or `app` directory" — correct behaviour against a branch that
      # holds one JSON file and no application. Several failures a day, which is worse than it
      # sounds: a dashboard permanently showing red nobody reads is a dashboard in which the one
      # red that matters goes unseen.
      #
      # It is switched off in the Vercel PROJECT setting "Ignored Build Step", not in a
      # vercel.json, and that is not a preference — it was measured. A vercel.json on main has
      # NO effect on a push to this branch: Vercel reads the config from the branch being
      # BUILT, and this branch carries no vercel.json. Both `git.deploymentEnabled` and
      # `ignoreCommand` fail for that reason. PR #232 tried the repo-versioned route, the merge
      # itself served as the test, and two subsequent pushes here still built and still failed;
      # #232 was reverted as dead config. Full record: PR #232 and its revert.
      #
      # Do NOT re-add a vercel.json here expecting it to help. If the builds ever come back,
      # the place to look is the project setting, not this repo.
      - name: Publish stats.json to the stats-data branch when it changed
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail
          norm() { jq -S 'del(.updatedAt)' "$1" 2>/dev/null; }
          # Reliably materialize refs/remotes/origin/stats-data (a bare `fetch <branch>` only
          # sets FETCH_HEAD). Fails harmlessly on the first run — the branch does not exist yet.
          git fetch origin +refs/heads/stats-data:refs/remotes/origin/stats-data 2>/dev/null || true
          if git show origin/stats-data:stats.json > /tmp/prev-stats.json 2>/dev/null \
             && [ "$(norm /tmp/prev-stats.json)" = "$(norm stats.json)" ]; then
            echo "stats.json unchanged (ignoring timestamp) — nothing to publish."
            exit 0
          fi
          BLOB=$(git hash-object -w stats.json)
          TREE=$(printf '100644 blob %s\tstats.json\n' "$BLOB" | git mktree)
          MSG="chore(stats): emit stats.json @ ${GITHUB_SHA:0:7}"
          if git rev-parse --verify origin/stats-data >/dev/null 2>&1; then
            COMMIT=$(git commit-tree "$TREE" -p origin/stats-data -m "$MSG")
          else
            COMMIT=$(git commit-tree "$TREE" -m "$MSG")
          fi
          # Belt: a git push with an EMPTY source refspec (":refs/heads/stats-data") is a
          # DELETE command — an empty $COMMIT would delete stats-data instead of updating it.
          # `set -e` already aborts on a failed commit-tree substitution; this is the explicit
          # guard so a branch deletion can never depend on implicit -e.
          [ -n "$COMMIT" ] || { echo "::error::commit-tree produced no commit — refusing to push (would delete stats-data)"; exit 1; }
          git push origin "${COMMIT}:refs/heads/stats-data"
